function DayView({st, me, cursor, setCursor, update}){
  const wk = weekOf(cursor, st.start);
  const W  = weightsFor(st, wk);
  const eA = st.entries.a[cursor], eB = st.entries.b[cursor];
  const sA = score(eA, W), sB = score(eB, W);
  const mine = me==='a'? sA : sB;
  const dayNo = diffDays(cursor, st.start)+1;
  const [flash, setFlash] = useState(0);

  /* proactive celebrations: crossing 80 → confetti, hitting 100 → the works */
  const change = v => {
    const before = score(me==='a'?eA:eB, W).total;
    update(me, cursor, v);
    const after = score(v, W).total;
    if(before < 100 && after >= 100){
      boom({count:260, power:1.5, spread:2.8});
      setTimeout(()=>boom({x:innerWidth*0.18, y:innerHeight*0.7, angle:-Math.PI/2.6, count:90}), 220);
      setTimeout(()=>boom({x:innerWidth*0.82, y:innerHeight*0.7, angle:-Math.PI+Math.PI/2.6, count:90}), 380);
      setFlash(f=>f+1);
    } else if(before < 80 && after >= 80){
      boom({count:140});
    }
  };

  return (
    <div className="view" key={cursor}>
      <div className="datestrip rise">
        <button className="arrow" onClick={()=>setCursor(addDays(cursor,-1))} aria-label="Previous day">‹</button>
        <button className="arrow" onClick={()=>setCursor(addDays(cursor,1))}
                disabled={cursor>=TODAY} aria-label="Next day">›</button>
        <div className="dt">
          {cursor===TODAY ? 'Today' : pretty(cursor)}
          <small>{cursor===TODAY ? pretty(cursor) : ''} {dayNo>=1&&dayNo<=30 ? `· Day ${dayNo} of 30` : ''}</small>
        </div>
        {cursor!==TODAY && <button className="today-btn" onClick={()=>setCursor(TODAY)}>Back to today</button>}
        <div className="strip-score">
          <Ring val={mine.total} max={100} size={92}
                tone={me==='a'?'#FF7A4D':'#4FC3E8'} label="your score"/>
        </div>
      </div>

      <VersusHero names={st.names} sA={sA} sB={sB}/>

      <div className="grid2">
        <Card title={`${st.names[me]} — log the day`} delay={90}
              note={<span>Week {wk} weights<br/>Scores save as you type</span>}>
          <LogForm entry={me==='a'?eA:eB} weights={W} tone={me==='a'?'pa':'pb'}
                   onChange={change} />
        </Card>

        <div>
          <Card title="Head to head" note={pretty(cursor)} delay={150}>
            {(!eA && !eB)
              ? <div className="empty"><span className="e-ico">🏸</span>Nothing logged for this day yet.<br/>Fill in the left panel to put a score on the board.</div>
              : <Court names={st.names} sA={sA} sB={sB} weights={W}/>}
          </Card>

          <Card title="Where the points went" delay={210}>
            {[['a',sA,eA],['b',sB,eB]].map(([p,s,e])=>(
              <div key={p} style={{padding:'10px 0',borderTop:p==='b'?'1px solid var(--line-soft)':'none'}}>
                <div style={{display:'flex',alignItems:'baseline',gap:10}}>
                  <span className={p==='a'?'a-tx':'b-tx'}
                        style={{fontFamily:'var(--disp)',fontWeight:800,letterSpacing:'.14em',textTransform:'uppercase',fontSize:12.5}}>{st.names[p]}</span>
                  <span className="num" style={{marginLeft:'auto',fontSize:15,fontWeight:700}}>{s.total}<span style={{color:'var(--ink-dim)'}}>/100</span></span>
                </div>
                {!e
                  ? <div style={{fontSize:13,color:'var(--ink-dim)',marginTop:4}}>Not logged.</div>
                  : <>
                      <div className="split">
                        {CATS.map(c=>(
                          <div key={c.key} className="seg" title={`${c.label} ${s.weighted[c.key]}/${W[c.key]}`}
                               style={{flex:W[c.key]}}>
                            <i style={{width:(W[c.key]?s.weighted[c.key]/W[c.key]*100:0)+'%',
                                       background:p==='a'?'linear-gradient(90deg,var(--pa-deep),var(--pa-mark))':'linear-gradient(90deg,var(--pb-mark),var(--pb-deep))'}}/>
                          </div>
                        ))}
                      </div>
                      {e.workout && e.workout.activity &&
                        <div style={{fontSize:13,color:'var(--ink-mid)',marginTop:9}}>💪 {e.workout.activity}</div>}
                      {e.note && <div style={{fontSize:13,color:'var(--ink-mid)',marginTop:4,fontStyle:'italic'}}>“{e.note}”</div>}
                    </>}
              </div>
            ))}
            <div className="golden">
              <b>Never let one bad day become a bad week.</b> A 32 you wrote honestly is worth more than a 72 you talked yourself into.
            </div>
          </Card>
        </div>
      </div>
      {flash>0 && <div className="flash" key={flash} aria-hidden="true"><span className="fword">Perfect Day</span></div>}
    </div>
  );
}

function WeekView({st, setSt, me}){
  const curWeek = Math.min(5, Math.max(1, weekOf(TODAY, st.start)));
  const [wk, setWk] = useState(curWeek);
  const W = weightsFor(st, wk);
  const dates = weekDates(wk, st.start);
  const A = weekStats(st.entries.a, dates, W);
  const B = weekStats(st.entries.b, dates, W);
  const nextWeek = wk+1;
  const [draft, setDraft] = useState(null);
  const [tip, setTip] = useState(null);
  const [copied, setCopied] = useState(false);
  const [tickKey, setTickKey] = useState(0);
  const chartRef = useRef(null);
  const D = draft || weightsFor(st, nextWeek);
  const spent = CATS.reduce((s,c)=>s+D[c.key],0);

  const myStats = me==='a'?A:B;
  const weakest = CATS.reduce((w,c)=>{
    const pct = myStats.logged ? myStats.catTotals[c.key]/(W[c.key]*myStats.logged) : 1;
    return pct < w.pct ? {key:c.key,label:c.label,pct} : w;
  }, {key:null,label:'',pct:2});

  const suggest = () => {
    const pcts = CATS.map(c=>({key:c.key, pct: myStats.logged? myStats.catTotals[c.key]/(W[c.key]*myStats.logged) : 1}))
                     .sort((x,y)=>x.pct-y.pct);
    const n = {...BASE_W};
    n[pcts[0].key] += 10;
    n[pcts[pcts.length-1].key] -= 5;
    n[pcts[pcts.length-2].key] -= 5;
    setDraft(n); setTickKey(k=>k+1);
  };
  const applyWeights = () => {
    setSt(s=>({...s, weights:{...s.weights, [nextWeek]:{...D}}}));
    setDraft(null);
    boom({count:90, y:innerHeight*0.55});
  };
  const bump = (key, delta) => {
    setDraft({...D, [key]:Math.max(0, D[key]+delta)});
    setTickKey(k=>k+1);
  };

  A.streak = streakFor(st.entries.a);
  B.streak = streakFor(st.entries.b);

  const sundayMsg =
`Week ${wk} — ${myStats.total}/700 🔥
Average: ${myStats.avg}/100
Best day: ${myStats.best}/100
Workout: ${myStats.workout}/7
Learning: ${myStats.learning}/7
Sleep: ${myStats.sleep}/7
Streak: ${myStats.streak} days

Week ${nextWeek}. Beat it. 😎`;

  const copyMsg = async () => {
    try{ await navigator.clipboard.writeText(sundayMsg); setCopied(true); setTimeout(()=>setCopied(false),1600); }
    catch(e){ /* textarea stays selectable as fallback */ }
  };

  const Scoreboard = ({name, s, tone, delay}) => (
    <Card title={name} note={`${s.logged}/7 days logged`} delay={delay}>
      <div style={{display:'flex',alignItems:'baseline',gap:12,marginBottom:15}}>
        <Num v={s.total} style={{fontSize:47,fontWeight:800,lineHeight:1,color:tone,textShadow:'0 0 24px '+tone+'55'}}/>
        <span className="num" style={{fontSize:19,color:'var(--ink-dim)'}}>/700</span>
        <span className="eyebrow" style={{marginLeft:'auto'}}>Avg {s.avg}/100</span>
      </div>
      <div className="stats">
        <div className="stat"><div className="k">Best day</div><div className="v"><Num v={s.best}/><small>/100</small></div></div>
        <div className="stat"><div className="k">Workout days</div><div className="v"><Num v={s.workout}/><small>/7</small></div></div>
        <div className="stat"><div className="k">Learning days</div><div className="v"><Num v={s.learning}/><small>/7</small></div></div>
        <div className="stat"><div className="k">Good sleep</div><div className="v"><Num v={s.sleep}/><small>/7</small></div></div>
        <div className="stat"><div className="k">Streak</div><div className="v"><Num v={s.streak}/><small> days</small></div></div>
        <div className="stat"><div className="k">Days logged</div><div className="v"><Num v={s.logged}/><small>/7</small></div></div>
      </div>
    </Card>
  );

  const maxBar = 100;
  const showTip = (i, ev) => {
    const zone = chartRef.current; if(!zone) return;
    const zr = zone.getBoundingClientRect();
    const cr = ev.currentTarget.getBoundingClientRect();
    setTip({i, x:cr.left+cr.width/2-zr.left, y:cr.top-zr.top+6});
  };

  return (
    <div className="view">
      <div className="datestrip rise">
        <button className="arrow" onClick={()=>{setWk(w=>Math.max(1,w-1));setDraft(null);}} disabled={wk<=1} aria-label="Previous week">‹</button>
        <button className="arrow" onClick={()=>{setWk(w=>Math.min(5,w+1));setDraft(null);}} disabled={wk>=5} aria-label="Next week">›</button>
        <div className="dt">Week {wk}<small>{pretty(dates[0])} — {pretty(dates[6])}</small></div>
        <div className="strip-score" style={{textAlign:'right'}}>
          <div>
            <span className="eyebrow">Weekly gap</span>
            <div>
              <Num v={A.total===B.total ? 0 : Math.abs(A.total-B.total)}
                   style={{fontFamily:'var(--mono)',fontSize:40,fontWeight:800,lineHeight:1.05,
                           color: A.total===B.total?'var(--ink)':(A.total>B.total?'var(--pa)':'var(--pb)')}}/>
              <span className="num" style={{color:'var(--ink-dim)'}}> pts</span>
            </div>
          </div>
        </div>
      </div>

      <div className="grid2">
        <Scoreboard name={st.names.a} s={A} tone="#FF7A4D" delay={60}/>
        <Scoreboard name={st.names.b} s={B} tone="#4FC3E8" delay={120}/>
      </div>

      <Card title="Day by day" note="Hover a day for the exact scores" delay={180}>
        <div className="legend">
          <span className="li"><span className="dot" style={{background:'var(--pa-mark)'}}/>{st.names.a}</span>
          <span className="li"><span className="dot" style={{background:'var(--pb-mark)'}}/>{st.names.b}</span>
          <span className="li"><span className="dot" style={{background:'rgba(148,178,255,.15)'}}/>not logged</span>
        </div>
        <div className="chart-zone" ref={chartRef} onMouseLeave={()=>setTip(null)}>
          <div className="chart">
            {dates.map((k,i)=>{
              const a=score(st.entries.a[k],W).total, b=score(st.entries.b[k],W).total;
              return (
                <div className="daycol" key={k}
                     onMouseEnter={ev=>showTip(i,ev)} onMouseMove={ev=>showTip(i,ev)}>
                  <div className="pair">
                    <div className={'bar '+(st.entries.a[k]?'a':'ghost')}
                         style={{height:Math.max(2,a/maxBar*100)+'%','--d':(i*60)+'ms'}}/>
                    <div className={'bar '+(st.entries.b[k]?'b':'ghost')}
                         style={{height:Math.max(2,b/maxBar*100)+'%','--d':(i*60+30)+'ms'}}/>
                  </div>
                </div>
              );
            })}
          </div>
          {tip && (()=>{
            const k = dates[tip.i];
            const a = score(st.entries.a[k],W).total, b = score(st.entries.b[k],W).total;
            return (
              <div className="tip" style={{left:tip.x, top:tip.y}}>
                <div className="th">{pretty(k)}</div>
                <div className="tr"><span className="dot" style={{background:'var(--pa-mark)'}}/>{st.names.a}<b>{st.entries.a[k]? a : '—'}</b></div>
                <div className="tr"><span className="dot" style={{background:'var(--pb-mark)'}}/>{st.names.b}<b>{st.entries.b[k]? b : '—'}</b></div>
              </div>
            );
          })()}
        </div>
        <div className="xaxis">
          {dates.map(k=>(
            <span key={k} className={'xlab'+(k===TODAY?' now':'')}>{DOW[fromKey(k).getDay()]}<span className="xd">{fromKey(k).getDate()}</span></span>
          ))}
        </div>
      </Card>

      <Card title="Sunday rebalance" delay={240}
            note={<span>Reweight week {nextWeek}<br/>Total must stay at 100</span>}>
        <p style={{marginTop:0,color:'var(--ink-mid)',fontSize:14}}>
          Your weakest area in week {wk} was <b style={{color:'var(--bad)'}}>{weakest.label}</b> at {Math.round(weakest.pct*100)}% of its points.
          Make it worth more next week and the game pushes you straight at it.
        </p>
        {CATS.map(c=>{
          const pct = myStats.logged ? myStats.catTotals[c.key]/(W[c.key]*myStats.logged) : 0;
          const isWeak = c.key===weakest.key;
          return (
            <div className="wt-row" key={c.key}>
              <div className="wt-name">{c.icon} {c.label}</div>
              <div>
                <div className="meter"><i className={isWeak?'weak':(pct>=.8?'strong':'')} style={{width:Math.round(pct*100)+'%'}}/></div>
                <div className="meter-cap">week {wk}: {Math.round(pct*100)}% earned</div>
              </div>
              <div className="stepper">
                <button className="step" onClick={()=>bump(c.key,-5)} disabled={D[c.key]<=0} aria-label={'Lower '+c.label}>−</button>
                <span className={'n tick'} key={c.key+'-'+D[c.key]+'-'+tickKey}>{D[c.key]}</span>
                <button className="step" onClick={()=>bump(c.key,+5)} aria-label={'Raise '+c.label}>+</button>
              </div>
            </div>
          );
        })}
        <div className="budget">
          <span className="eyebrow">Allocated</span>
          <span className="num" style={{fontSize:21,fontWeight:800,color: spent===100?'var(--gold)':'var(--bad)',
                textShadow: spent===100?'0 0 12px rgba(245,196,69,.45)':'none'}}>{spent}</span>
          <span className="num" style={{color:'var(--ink-dim)'}}>/100</span>
          <div style={{marginLeft:'auto',display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className="btn" onClick={suggest}>Suggest a split</button>
            <button className="btn" onClick={()=>{setDraft({...BASE_W});setTickKey(k=>k+1);}}>Reset to default</button>
            <button className="btn gold" onClick={applyWeights} disabled={spent!==100}>Apply to week {nextWeek}</button>
          </div>
        </div>
      </Card>

      <Card title="Sunday message" note="Send it. Talk your talk." delay={300}>
        <textarea className="txt" rows="7" readOnly value={sundayMsg}/>
        <div style={{display:'flex',marginTop:10}}>
          <button className="btn gold" onClick={copyMsg}>{copied ? 'Copied ✓' : 'Copy message'}</button>
        </div>
      </Card>
    </div>
  );
}

function ChallengeView({st}){
  const days = Array.from({length:30},(_,i)=>addDays(st.start,i));
  const totals = {a:0,b:0};
  const cells = days.map((k,i)=>{
    const W = weightsFor(st, weekOf(k, st.start));
    const a = score(st.entries.a[k],W), b = score(st.entries.b[k],W);
    totals.a += a.total; totals.b += b.total;
    return {k, i, a:a.total, b:b.total, hasA:!!st.entries.a[k], hasB:!!st.entries.b[k]};
  });

  const Level = ({p, tone, glow}) => {
    const pts = totals[p];
    const lv = levelFor(pts);
    const next = LEVELS[LEVELS.indexOf(lv)+1];
    const span = next ? next.min - lv.min : 1;
    const pct = next ? Math.min(100,(pts-lv.min)/span*100) : 100;
    return (
      <div className="lvl">
        <div className="lvl-top">
          <span className="lvl-name" style={{color:tone}}>{st.names[p]}</span>
          <span className="lvl-pts"><Num v={pts}/></span>
          <span className="lvl-tier">{lv.icon} {lv.name}</span>
        </div>
        <div className="lvl-bar">
          <i style={{width:pct+'%',background:'linear-gradient(90deg,'+glow+','+tone+')'}}/>
          <div className="lvl-marks" aria-hidden="true">
            {[20,40,60,80].map(m=><i key={m} style={{left:m+'%'}}/>)}
          </div>
        </div>
        <div className="lvl-next">{next ? `${next.min-pts} points to ${next.icon} ${next.name}` : 'Top level reached 👑'}</div>
      </div>
    );
  };

  return (
    <div className="view">
      <div className="datestrip rise">
        <div className="dt">
          The full 30
          <small>{pretty(st.start)} — {pretty(addDays(st.start,29))}</small>
        </div>
        <div className="strip-score" style={{textAlign:'right'}}>
          <div>
            <span className="eyebrow">Combined points</span>
            <div><Num v={totals.a+totals.b} style={{fontFamily:'var(--mono)',fontSize:40,fontWeight:800,lineHeight:1.05,color:'var(--gold)',textShadow:'0 0 20px rgba(245,196,69,.4)'}}/></div>
          </div>
        </div>
      </div>

      <Card title="Every day on the board" delay={60}
            note={<span><span className="a-tx">■</span> {st.names.a} &nbsp; <span className="b-tx">■</span> {st.names.b}</span>}>
        <div className="dgrid">
          {cells.map(c=>(
            <div key={c.k} className={'dcell'+(c.k===TODAY?' today':'')}
                 style={{'--d':(c.i*26)+'ms'}}
                 title={`${pretty(c.k)} — ${st.names.a} ${c.hasA?c.a:'—'}, ${st.names.b} ${c.hasB?c.b:'—'}`}>
              <div className="dbars">
                <div className={'dbar'+(c.hasA?' a':'')} style={{height:Math.max(2,c.a/100*38)+'px'}}/>
                <div className={'dbar'+(c.hasB?' b':'')} style={{height:Math.max(2,c.b/100*38)+'px'}}/>
              </div>
              <div className="dn">{c.i+1}</div>
            </div>
          ))}
        </div>
      </Card>

      <Card title="Levels" note="Points across all 30 days" delay={140}>
        <Level p="a" tone="#FF7A4D" glow="#b23a14"/>
        <Level p="b" tone="#4FC3E8" glow="#0e6a8c"/>
        <hr className="rule"/>
        <div className="lvl-ladder">
          {LEVELS.map(l=>(
            <div key={l.name} className="li">
              <span className="m">{l.min}+</span> {l.icon} {l.name}
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

function SetupView({st, setSt, me, reload}){
  const [io, setIo] = useState('');
  const [msg, setMsg] = useState('');

  const csv = () => {
    const rows = [['Date','Day','Week','Player','Wakeup','Workout','Work','Personal','Sleep','Total','Activity','Note']];
    ['a','b'].forEach(p=>{
      Object.keys(st.entries[p]).sort().forEach(k=>{
        const wk = weekOf(k, st.start), W = weightsFor(st, wk);
        const s = score(st.entries[p][k], W), e = st.entries[p][k];
        rows.push([k, diffDays(k,st.start)+1, wk, st.names[p],
          s.weighted.wakeup, s.weighted.workout, s.weighted.work, s.weighted.personal, s.weighted.sleep, s.total,
          (e.workout&&e.workout.activity)||'', (e.note||'').replace(/"/g,"'")]);
      });
    });
    const text = rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text],{type:'text/csv'}));
    a.download = `project-100-${TODAY}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setMsg('Downloaded project-100-'+TODAY+'.csv');
  };

  const exportJson = () => { setIo(JSON.stringify(st)); setMsg('Copy the text below and send it over.'); };
  const importJson = () => {
    try{
      const inc = JSON.parse(io);
      if(!inc.entries) throw new Error('no entries');
      setSt(s=>{
        const merged = {a:{...s.entries.a}, b:{...s.entries.b}};
        ['a','b'].forEach(p=>{
          Object.keys(inc.entries[p]||{}).forEach(k=>{
            // their days overwrite; my own days are never clobbered by an import
            if(p!==me || !merged[p][k]) merged[p][k] = inc.entries[p][k];
          });
        });
        return {...s, entries:merged, weights:{...inc.weights, ...s.weights}};
      });
      setMsg('Merged. Their days are in; yours were left alone.');
      setIo('');
      boom({count:80});
    }catch(e){ setMsg('That text is not a valid export. Paste the whole thing, including the braces.'); }
  };

  return (
    <div className="view">
      <div className="datestrip rise">
        <div className="dt">Setup<small>Names, dates &amp; data</small></div>
      </div>

      <div className="grid2">
        <Card title="The two of you" delay={60}>
          <div className="field">
            <span className="eyebrow" style={{color:'var(--pa)'}}>Player A</span>
            <input className="txt" value={st.names.a} maxLength="18"
                   onChange={e=>setSt(s=>({...s,names:{...s.names,a:e.target.value}}))}/>
          </div>
          <div className="field">
            <span className="eyebrow" style={{color:'var(--pb)'}}>Player B</span>
            <input className="txt" value={st.names.b} maxLength="18"
                   onChange={e=>setSt(s=>({...s,names:{...s.names,b:e.target.value}}))}/>
          </div>
          <div className="field">
            <span className="eyebrow">Day 1 of the challenge</span>
            <input className="txt" type="date" value={st.start}
                   onChange={e=>e.target.value && setSt(s=>({...s,start:e.target.value}))}/>
          </div>
          <p style={{fontSize:13,color:'var(--ink-dim)',margin:0}}>
            Day 1 sets the week boundaries, so change it before you start logging rather than halfway through.
          </p>
        </Card>

        <Card title="Sharing scores" delay={120}>
          <p style={{marginTop:0,fontSize:13.5,color:'var(--ink-mid)'}}>
            {hasClaude
              ? 'Both of you are writing to the same shared record, so scores show up on each other\'s screen without any exporting.'
              : 'This copy saves to this browser only. To compare, one of you exports and the other pastes it in — Sunday is a good rhythm for that.'}
          </p>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
            <button className="btn gold" onClick={csv}>Download scores (CSV)</button>
            <button className="btn" onClick={exportJson}>Export my data</button>
            <button className="btn" onClick={importJson} disabled={!io.trim()}>Merge pasted data</button>
          </div>
          <textarea className="txt" rows="6" value={io} onChange={e=>{setIo(e.target.value);setMsg('');}}
                    placeholder="Export drops your data here. Or paste your friend's export and hit merge."/>
          {msg && <p style={{fontSize:13,color:'var(--gold)',marginBottom:0}}>{msg}</p>}
        </Card>
      </div>

      <Card title="Start over" delay={180}>
        <p style={{marginTop:0,fontSize:13.5,color:'var(--ink-mid)'}}>
          Wipes every logged day for both players. Download the CSV first if you want to keep the record.
        </p>
        <button className="btn danger" onClick={()=>{
          if(confirm('Erase all 30 days for both players?')){ reload(freshState()); }
        }}>Erase everything</button>
      </Card>
    </div>
  );
}

/* ============================================================
   App
   ============================================================ */
const TABS = [
  ['day',  'Today',   '⚔️'],
  ['week', 'Week',    '📊'],
  ['run',  '30 Days', '🗓️'],
  ['setup','Setup',   '⚙️'],
];

function App(){
  const [st, setSt] = useState(null);
  const [me, setMe] = useState('a');
  const [tab, setTab] = useState('day');
  const [cursor, setCursor] = useState(TODAY);
  const [saved, setSaved] = useState(false);
  const first = useRef(true);
  const tabRefs = useRef({});
  const tabsRef = useRef(null);
  const [ink, setInk] = useState({left:0,width:0});

  useEffect(()=>{ (async()=>{
    const s = await store.get(KEY, true);
    const m = await store.get(ME, false);
    setSt(s && s.entries ? {...freshState(), ...s} : freshState());
    if(m==='a'||m==='b') setMe(m);
  })(); },[]);

  useEffect(()=>{
    if(!st) return;
    if(first.current){ first.current=false; return; }
    const t = setTimeout(async()=>{
      await store.set(KEY, st, true);
      setSaved(true); setTimeout(()=>setSaved(false), 1400);
    }, 450);
    return ()=>clearTimeout(t);
  },[st]);

  /* sliding tab ink */
  useLayoutEffect(()=>{
    const el = tabRefs.current[tab], zone = tabsRef.current;
    if(!el || !zone) return;
    const measure = () => setInk({left: el.offsetLeft, width: el.offsetWidth});
    measure();
    addEventListener('resize', measure);
    return ()=>removeEventListener('resize', measure);
  },[tab, st]);

  const pickMe = p => { setMe(p); store.set(ME, p, false); };
  const goTab = k => { setTab(k); window.scrollTo({top:0, behavior: REDUCED ? 'auto' : 'smooth'}); };
  const update = useCallback((player, date, entry)=>{
    setSt(s=>({...s, entries:{...s.entries, [player]:{...s.entries[player], [date]:entry}}}));
  },[]);

  if(!st) return (
    <>
      <Sky/>
      <div className="wrap" style={{paddingTop:80,color:'var(--ink-dim)',textAlign:'center'}}>
        <div className="empty"><span className="e-ico">🏸</span>Loading your scores…</div>
      </div>
    </>
  );

  const dayNo = diffDays(TODAY, st.start)+1;
  const myStreak = streakFor(st.entries[me]);

  return (
    <>
      <Sky/>
      <ConfettiLayer/>
      <header className="topbar">
        <div className="topbar-in">
          <h1 className="brand">
            <span className="brand-badge" aria-hidden="true">🏸</span>
            <span>
              <span className="brand-name">Project <b>100</b></span>
              <span className="brand-sub">The Arena</span>
            </span>
          </h1>
          <span className="daychip">{dayNo>=1&&dayNo<=30 ? `DAY ${pad(dayNo)} / 30` : (dayNo<1 ? 'NOT STARTED' : 'COMPLETE')}</span>
          {myStreak>0 && <span className="streakchip" title={'Current streak: '+myStreak+' days'}><span className="fl">🔥</span>{myStreak}</span>}
          <div className="who">
            <span className="who-label">Logging as</span>
            <div className="pillbox">
              <button className={'pill'+(me==='a'?' on-a':'')} onClick={()=>pickMe('a')}>{st.names.a}</button>
              <button className={'pill'+(me==='b'?' on-b':'')} onClick={()=>pickMe('b')}>{st.names.b}</button>
            </div>
          </div>
        </div>
        <nav className="tabs" ref={tabsRef}>
          {TABS.map(([k,l,ic])=>(
            <button key={k} ref={el=>tabRefs.current[k]=el}
                    className={'tab'+(tab===k?' on':'')} onClick={()=>goTab(k)}>
              <span className="ticon" aria-hidden="true">{ic}</span>{l}
            </button>
          ))}
          <span className="tab-ink" style={{left:ink.left, width:ink.width}} aria-hidden="true"/>
        </nav>
      </header>

      <main className="wrap">
        {tab==='day'  && <DayView key="day" st={st} me={me} cursor={cursor} setCursor={setCursor} update={update}/>}
        {tab==='week' && <WeekView key="week" st={st} setSt={setSt} me={me}/>}
        {tab==='run'  && <ChallengeView key="run" st={st}/>}
        {tab==='setup'&& <SetupView key="setup" st={st} setSt={setSt} me={me} reload={setSt}/>}
      </main>

      <div className={'toast'+(saved?' show':'')} role="status">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M2 7.5 5.5 11 12 3.5"/>
        </svg>
        Saved
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
