<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project 100 — The Arena</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ================================================================
   PROJECT 100 — "THE ARENA"
   Two players. Thirty days. One glowing arena.
   Ember (#EF5B2A / #FF7A4D) vs Tide (#22A0CC / #4FC3E8) on deep
   space navy. Every surface breathes, every score lands with
   weight, every interaction answers back.
   ================================================================ */
:root{
  --bg:        #070B14;
  --bg-2:      #0B1220;
  --panel:     rgba(16, 25, 44, .66);
  --panel-2:   rgba(23, 34, 58, .72);
  --glass-brd: rgba(148, 178, 255, .12);
  --glass-brd2:rgba(148, 178, 255, .22);
  --ink:       #EAF2FF;
  --ink-mid:   #97A8C6;
  --ink-dim:   #5E7095;
  --line:      rgba(148,178,255,.14);
  --line-soft: rgba(148,178,255,.07);

  --pa:        #FF7A4D;   /* ember — glow / text tint  */
  --pa-mark:   #EF5B2A;   /* ember — chart mark        */
  --pa-deep:   #b23a14;
  --pb:        #4FC3E8;   /* tide — glow / text tint   */
  --pb-mark:   #22A0CC;   /* tide — chart mark         */
  --pb-deep:   #0e6a8c;
  --gold:      #F5C445;
  --gold-deep: #8a6a12;
  --bad:       #FF5C7A;

  --disp: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --body: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --r: 18px;
  --r-s: 12px;
  --spring: cubic-bezier(.34,1.56,.5,1);
  --swift:  cubic-bezier(.22,.9,.24,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  /* clip, not hidden — hidden would turn body into a scroll container and break position:sticky */
  overflow-x:clip;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
::selection{background:rgba(245,196,69,.3)}

/* ---------------------------------------------------------------
   LIVING BACKGROUND — drifting player-coloured auroras, a slow
   rotating conic halo, starfield, and a faint arena grid.
   --------------------------------------------------------------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky::before{
  content:"";position:absolute;inset:-40%;
  background:conic-gradient(from 0deg at 50% 50%,
    transparent 0deg, rgba(239,91,42,.05) 70deg, transparent 140deg,
    rgba(34,160,204,.05) 220deg, transparent 300deg, rgba(245,196,69,.03) 340deg, transparent 360deg);
  animation:halo 90s linear infinite;
}
@keyframes halo{to{transform:rotate(1turn)}}
.sky::after{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(90deg, var(--line-soft) 0 1px, transparent 1px 110px),
    repeating-linear-gradient(0deg,  var(--line-soft) 0 1px, transparent 1px 110px);
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, #000 0%, transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, #000 0%, transparent 75%);
}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.orb.a{
  width:56vmax;height:56vmax;left:-18vmax;top:-24vmax;
  background:radial-gradient(circle at 35% 35%, rgba(239,91,42,.5), rgba(239,91,42,.12) 45%, transparent 70%);
  animation:drift-a 26s ease-in-out infinite alternate;
}
.orb.b{
  width:52vmax;height:52vmax;right:-16vmax;bottom:-22vmax;
  background:radial-gradient(circle at 60% 60%, rgba(34,160,204,.5), rgba(34,160,204,.12) 45%, transparent 70%);
  animation:drift-b 32s ease-in-out infinite alternate;
}
.orb.g{
  width:34vmax;height:34vmax;left:52%;top:38%;opacity:.22;
  background:radial-gradient(circle, rgba(245,196,69,.45), transparent 65%);
  animation:drift-g 40s ease-in-out infinite alternate;
}
@keyframes drift-a{from{transform:translate(0,0) scale(1)}to{transform:translate(9vmax,7vmax) scale(1.15)}}
@keyframes drift-b{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-8vmax,-6vmax) scale(.95)}}
@keyframes drift-g{from{transform:translate(-4vmax,2vmax)}to{transform:translate(5vmax,-4vmax)}}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--tw,4s) ease-in-out infinite alternate;will-change:opacity}
@keyframes twinkle{from{opacity:.05}to{opacity:var(--maxo,.7)}}

.fx{position:fixed;inset:0;z-index:200;pointer-events:none;width:100vw;height:100vh}

/* ---------------------------------------------------------------
   TYPE ROLES
   --------------------------------------------------------------- */
.eyebrow{
  font-family:var(--disp);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink-dim);font-weight:700;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.a-tx{color:var(--pa)}
.b-tx{color:var(--pb)}

/* ---------------------------------------------------------------
   SHELL
   --------------------------------------------------------------- */
.wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:0 22px 90px}

.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(7,11,20,.72);
  backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--line);
}
.topbar::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg, transparent, rgba(239,91,42,.6), rgba(245,196,69,.7), rgba(34,160,204,.6), transparent);
  background-size:200% 100%;
  animation:laser 6s linear infinite;
}
@keyframes laser{to{background-position:200% 0}}
.topbar-in{max-width:1160px;margin:0 auto;padding:14px 22px 10px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.brand{display:flex;align-items:center;gap:11px;margin:0}
.brand-badge{
  width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:conic-gradient(from 210deg, var(--pa-mark), var(--gold), var(--pb-mark), var(--pa-mark));
  box-shadow:0 0 18px rgba(245,196,69,.35), inset 0 0 0 1.5px rgba(255,255,255,.25);
  font-size:16px;
  animation:badge-spin 14s linear infinite;
}
@keyframes badge-spin{
  0%,86%{transform:rotate(0)}
  93%{transform:rotate(180deg)}
  100%{transform:rotate(360deg)}
}
.brand-name{font-family:var(--disp);font-weight:900;font-size:19px;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.brand-name b{
  background:linear-gradient(100deg, var(--pa) 10%, var(--gold) 50%, var(--pb) 90%);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sheen-tx 5s ease-in-out infinite alternate;
}
@keyframes sheen-tx{to{background-position:100% 0}}
.brand-sub{display:block;font-size:8.5px;letter-spacing:.4em;color:var(--ink-dim);font-weight:700;margin-top:2px}

.daychip{
  font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--gold);
  border:1px solid rgba(245,196,69,.35);border-radius:99px;padding:5px 13px;
  background:rgba(245,196,69,.07);
  box-shadow:0 0 14px rgba(245,196,69,.12), inset 0 0 8px rgba(245,196,69,.06);
  animation:chip-breathe 3.2s ease-in-out infinite;
}
@keyframes chip-breathe{
  0%,100%{box-shadow:0 0 10px rgba(245,196,69,.1), inset 0 0 8px rgba(245,196,69,.05)}
  50%{box-shadow:0 0 22px rgba(245,196,69,.28), inset 0 0 10px rgba(245,196,69,.1)}
}
.streakchip{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink-mid);
  border:1px solid var(--line);border-radius:99px;padding:5px 12px;
}
.streakchip .fl{display:inline-block;animation:flame .9s ease-in-out infinite alternate;transform-origin:50% 90%}
@keyframes flame{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.22) rotate(5deg)}}

.who{margin-left:auto;display:flex;align-items:center;gap:9px}
.who-label{font-family:var(--disp);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);font-weight:700}
.pillbox{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px;gap:3px;background:rgba(0,0,0,.25)}
.pill{
  position:relative;border-radius:99px;padding:6px 15px;
  font-family:var(--disp);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  color:var(--ink-mid);transition:color .25s, transform .2s var(--spring);
}
.pill:hover{color:var(--ink);transform:translateY(-1px)}
.pill:active{transform:scale(.94)}
.pill.on-a{
  background:linear-gradient(135deg, var(--pa-mark), #ff8a5c);color:#1c0700;
  box-shadow:0 0 16px rgba(239,91,42,.55), 0 3px 10px rgba(0,0,0,.4);
  animation:pill-pop .38s var(--spring);
}
.pill.on-b{
  background:linear-gradient(135deg, var(--pb-mark), #55c8ec);color:#001820;
  box-shadow:0 0 16px rgba(34,160,204,.55), 0 3px 10px rgba(0,0,0,.4);
  animation:pill-pop .38s var(--spring);
}
@keyframes pill-pop{0%{transform:scale(.82)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

/* ------- tabs with sliding ink ------- */
.tabs{max-width:1160px;margin:0 auto;padding:6px 22px 0;display:flex;gap:4px;overflow-x:auto;position:relative;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;display:flex;align-items:center;gap:7px;white-space:nowrap;
  font-family:var(--disp);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--ink-dim);padding:10px 16px 12px;border-radius:10px 10px 0 0;
  transition:color .25s, transform .2s var(--spring);
}
.tab .ticon{font-size:14px;filter:grayscale(1) opacity(.6);transition:filter .3s, transform .3s var(--spring)}
.tab:hover{color:var(--ink)}
.tab:hover .ticon{filter:none;transform:translateY(-2px)}
.tab.on{color:var(--ink)}
.tab.on .ticon{filter:none;animation:ticon-pop .45s var(--spring)}
@keyframes ticon-pop{0%{transform:scale(.5) rotate(-20deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.tab-ink{
  position:absolute;bottom:0;height:3px;border-radius:3px 3px 0 0;
  background:linear-gradient(90deg, var(--pa), var(--gold), var(--pb));
  box-shadow:0 0 12px rgba(245,196,69,.6);
  transition:left .35s var(--spring), width .35s var(--spring);
}

/* ---------------------------------------------------------------
   VIEW TRANSITIONS + STAGGERED ENTRANCES
   --------------------------------------------------------------- */
.view{animation:view-in .5s var(--swift) both}
@keyframes view-in{from{opacity:0;transform:translateY(18px) scale(.995)}to{opacity:1;transform:none}}
.rise{animation:rise .6s var(--swift) both;animation-delay:var(--d,0ms)}
@keyframes rise{
  from{opacity:0;transform:translateY(26px) scale(.985);filter:blur(5px)}
  to{opacity:1;transform:none;filter:blur(0)}
}

/* ---------------------------------------------------------------
   CARDS — glass, glow border, cursor spotlight
   --------------------------------------------------------------- */
.card{
  position:relative;
  background:var(--panel);
  border:1px solid var(--glass-brd);
  border-radius:var(--r);
  padding:22px;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 44px -18px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
  transition:border-color .3s, transform .3s var(--swift), box-shadow .3s;
  overflow:hidden;
}
.card::before{ /* cursor spotlight */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,-20%),
    rgba(148,178,255,.09), transparent 65%);
  opacity:0;transition:opacity .35s;
}
.card:hover{border-color:var(--glass-brd2);transform:translateY(-2px);
  box-shadow:0 26px 60px -20px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.07)}
.card:hover::before{opacity:1}
.card + .card{margin-top:18px}
.card-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px}
.card-head h2{
  font-family:var(--disp);font-size:13.5px;letter-spacing:.22em;text-transform:uppercase;
  margin:0;font-weight:800;color:var(--ink);
  display:flex;align-items:center;gap:9px;
}
.card-head h2::before{
  content:"";width:5px;height:5px;border-radius:2px;background:var(--gold);
  box-shadow:0 0 8px var(--gold);flex:none;
}
.card-note{font-size:11.5px;color:var(--ink-dim);margin-left:auto;text-align:right;line-height:1.45}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:880px){.grid2{grid-template-columns:1fr}}

/* ---------------------------------------------------------------
   DATE STRIP + SCORE RING
   --------------------------------------------------------------- */
.datestrip{
  display:flex;align-items:center;gap:16px;
  padding:20px 0 22px;margin-bottom:4px;flex-wrap:wrap;
}
.arrow{
  width:40px;height:40px;border:1px solid var(--line);border-radius:12px;
  color:var(--ink-mid);font-size:17px;display:grid;place-items:center;
  background:rgba(255,255,255,.02);
  transition:transform .2s var(--spring), border-color .2s, color .2s, box-shadow .2s;
}
.arrow:hover:not(:disabled){border-color:var(--glass-brd2);color:var(--ink);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.arrow:active:not(:disabled){transform:scale(.88)}
.arrow:disabled{opacity:.25;cursor:not-allowed}
.datestrip .dt{font-family:var(--disp);font-size:27px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.15}
.datestrip .dt small{display:block;font-size:10.5px;letter-spacing:.24em;color:var(--ink-dim);font-weight:700}
.today-btn{
  font-family:var(--disp);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--gold);border:1px solid rgba(245,196,69,.4);border-radius:99px;padding:6px 14px;
  transition:all .25s var(--spring);
}
.today-btn:hover{background:rgba(245,196,69,.12);box-shadow:0 0 14px rgba(245,196,69,.25);transform:translateY(-1px)}
.strip-score{margin-left:auto;display:flex;align-items:center;gap:14px}

.ring-wrap{position:relative;display:grid;place-items:center}
.ring-wrap svg{transform:rotate(-90deg);overflow:visible}
.ring-track{fill:none;stroke:rgba(148,178,255,.1);stroke-width:7}
.ring-val{
  fill:none;stroke-width:7;stroke-linecap:round;
  transition:stroke-dashoffset .9s var(--swift), stroke .4s, filter .4s;
}
.ring-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-center .rv{font-family:var(--mono);font-weight:800;font-size:26px;line-height:1}
.ring-center .rl{font-size:8.5px;letter-spacing:.22em;color:var(--ink-dim);text-transform:uppercase;font-weight:700;margin-top:2px}
.ring-pulse{animation:ring-pulse .5s var(--spring)}
@keyframes ring-pulse{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}

/* ---------------------------------------------------------------
   LOG FORM
   --------------------------------------------------------------- */
.cat{border-top:1px solid var(--line-soft);padding:17px 0;position:relative}
.cat:first-of-type{border-top:none;padding-top:0}
.cat-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cat-ico{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:none;
  background:rgba(148,178,255,.07);border:1px solid var(--line-soft);
  transition:transform .3s var(--spring), box-shadow .3s, border-color .3s;
}
.cat:hover .cat-ico{transform:translateY(-2px) rotate(-6deg) scale(1.08)}
.cat.maxed .cat-ico{
  border-color:rgba(245,196,69,.5);box-shadow:0 0 14px rgba(245,196,69,.3);
  animation:maxed-bounce .5s var(--spring);
}
@keyframes maxed-bounce{0%{transform:scale(.7) rotate(-15deg)}60%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1)}}
.cat-name{font-family:var(--disp);font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:800}
.cat-pts{margin-left:auto;font-family:var(--mono);font-size:13.5px;color:var(--ink-dim);font-weight:500}
.cat-pts b{color:var(--ink);font-weight:800;font-size:15px}
.cat-pts.full b{color:var(--gold);text-shadow:0 0 12px rgba(245,196,69,.5)}
.wt-flag{
  font-family:var(--mono);font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px;
  border:1px solid rgba(245,196,69,.45);color:var(--gold);background:rgba(245,196,69,.08);
}
.cat-meter{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent;overflow:hidden;border-radius:2px}
.cat-meter i{
  display:block;height:100%;border-radius:2px;
  background:linear-gradient(90deg, transparent, var(--tone,var(--gold)));
  opacity:.55;transition:width .6s var(--swift);
}

/* checkboxes — springy pop + drawn tick + burst */
.check{
  position:relative;display:flex;align-items:center;gap:12px;padding:8px 10px;margin:0 -10px;cursor:pointer;
  font-size:14px;color:var(--ink-mid);border-radius:10px;
  transition:color .2s, background .2s;
}
.check:hover{color:var(--ink);background:rgba(148,178,255,.05)}
.check input{position:absolute;opacity:0;width:0;height:0}
.box{
  position:relative;width:21px;height:21px;flex:none;border:1.5px solid var(--ink-dim);border-radius:7px;
  display:grid;place-items:center;
  transition:background .25s, border-color .25s, transform .3s var(--spring), box-shadow .3s;
}
.check:hover .box{border-color:var(--ink-mid);transform:scale(1.08)}
.check input:checked ~ .box{
  background:linear-gradient(135deg, var(--gold), #ffdf8a);border-color:var(--gold);
  box-shadow:0 0 12px rgba(245,196,69,.45);
  animation:box-pop .42s var(--spring);
}
@keyframes box-pop{0%{transform:scale(.55) rotate(-12deg)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
.box svg{width:12px;height:12px}
.box svg path{
  stroke-dasharray:16;stroke-dashoffset:16;
  transition:stroke-dashoffset .28s ease-out .06s;
}
.check input:checked ~ .box svg path{stroke-dashoffset:0}
.box .burst{position:absolute;inset:-8px;pointer-events:none}
.box .burst i{
  position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:var(--gold);
  opacity:0;
}
.check input:checked ~ .box .burst i{animation:spark .5s ease-out both;animation-delay:.04s}
.box .burst i:nth-child(1){--dx:-16px;--dy:-10px}
.box .burst i:nth-child(2){--dx:16px;--dy:-12px}
.box .burst i:nth-child(3){--dx:-13px;--dy:12px}
.box .burst i:nth-child(4){--dx:14px;--dy:11px}
.box .burst i:nth-child(5){--dx:0px;--dy:-17px}
.box .burst i:nth-child(6){--dx:0px;--dy:17px}
@keyframes spark{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.2)}
}
.check .val{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-dim);transition:color .25s, transform .3s var(--spring)}
.check input:checked ~ .val{color:var(--gold);transform:scale(1.15);font-weight:700}
.check input:focus-visible ~ .box{outline:2px solid var(--gold);outline-offset:2px}

/* workout tier buttons */
.tiers{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.tier{
  position:relative;border:1px solid var(--line);border-radius:12px;padding:8px 13px;
  font-size:12.5px;color:var(--ink-mid);line-height:1.25;text-align:center;
  background:rgba(255,255,255,.02);overflow:hidden;
  transition:transform .25s var(--spring), border-color .25s, color .25s, box-shadow .25s;
}
.tier b{display:block;font-family:var(--mono);font-size:13px;color:var(--ink-dim);transition:color .25s}
.tier:hover{border-color:var(--glass-brd2);color:var(--ink);transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.35)}
.tier:active{transform:scale(.92)}
.tier.on{
  background:linear-gradient(150deg, rgba(245,196,69,.16), rgba(245,196,69,.05));
  border-color:var(--gold);color:var(--ink);
  box-shadow:0 0 16px rgba(245,196,69,.25), inset 0 0 12px rgba(245,196,69,.06);
  animation:tier-land .4s var(--spring);
}
@keyframes tier-land{0%{transform:scale(.85)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
.tier.on b{color:var(--gold)}
.tier.on::after{
  content:"";position:absolute;top:0;left:-80%;width:60%;height:100%;
  background:linear-gradient(105deg, transparent, rgba(255,255,255,.18), transparent);
  animation:shine 2.6s ease-in-out infinite;
}
@keyframes shine{0%{left:-80%}55%,100%{left:130%}}

/* sliders — glowing gradient fill */
.slider-row{display:grid;grid-template-columns:130px 1fr 48px;gap:13px;align-items:center;padding:7px 0}
.slider-row label{font-size:13.5px;color:var(--ink-mid);transition:color .2s}
.slider-row:hover label{color:var(--ink)}
.slider-row .v{font-family:var(--mono);font-size:13px;text-align:right;color:var(--ink);font-weight:700}
.slider-row .v .om{color:var(--ink-dim);font-weight:500}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;outline:none;cursor:pointer;
  --pct:0%;
  --tone:var(--gold);
  --tone2:#ffe08a;
}
input[type=range].pa{--tone:var(--pa-mark);--tone2:#ff9c72}
input[type=range].pb{--tone:var(--pb-mark);--tone2:#6fd2f0}
input[type=range]::-webkit-slider-runnable-track{
  height:6px;border-radius:4px;
  background:linear-gradient(90deg, var(--tone), var(--tone2) var(--pct), rgba(148,178,255,.14) var(--pct));
  box-shadow:inset 0 1px 2px rgba(0,0,0,.4);
  transition:box-shadow .3s;
}
input[type=range]::-moz-range-track{
  height:6px;border-radius:4px;background:rgba(148,178,255,.14);
}
input[type=range]::-moz-range-progress{
  height:6px;border-radius:4px;background:linear-gradient(90deg,var(--tone),var(--tone2));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
  background:#fff;border:none;cursor:grab;margin-top:-6px;
  box-shadow:0 0 0 3px rgba(255,255,255,.15), 0 0 14px var(--tone), 0 2px 6px rgba(0,0,0,.5);
  transition:transform .2s var(--spring), box-shadow .2s;
}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.25)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.45);cursor:grabbing}
input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:#fff;border:none;cursor:grab;
  box-shadow:0 0 0 3px rgba(255,255,255,.15), 0 0 14px var(--tone), 0 2px 6px rgba(0,0,0,.5);
}

.txt{
  width:100%;background:rgba(7,11,20,.55);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;font-size:14px;color:var(--ink);
  transition:border-color .25s, box-shadow .25s, background .25s;
}
.txt::placeholder{color:var(--ink-dim)}
.txt:focus{border-color:rgba(245,196,69,.55);outline:none;box-shadow:0 0 0 3px rgba(245,196,69,.12);background:rgba(7,11,20,.75)}
textarea.txt{resize:vertical;font-family:var(--mono);font-size:12px;line-height:1.6}

/* ---------------------------------------------------------------
   VERSUS HERO — the marquee head-to-head strip
   --------------------------------------------------------------- */
.versus{
  position:relative;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--glass-brd);margin-bottom:18px;
  background:
    radial-gradient(120% 160% at 0% 50%, rgba(239,91,42,.2), transparent 55%),
    radial-gradient(120% 160% at 100% 50%, rgba(34,160,204,.2), transparent 55%),
    var(--panel);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:20px 22px 18px;
}
.versus-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.vs-side{display:flex;flex-direction:column;gap:2px;min-width:0}
.vs-side.r{text-align:right;align-items:flex-end}
.vs-name{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vs-score{font-family:var(--mono);font-weight:800;font-size:52px;line-height:1;letter-spacing:-.04em}
.vs-score .of{font-size:19px;color:var(--ink-dim);font-weight:500;letter-spacing:0}
.vs-side.l .vs-score{color:var(--pa);text-shadow:0 0 26px rgba(239,91,42,.45)}
.vs-side.r .vs-score{color:var(--pb);text-shadow:0 0 26px rgba(34,160,204,.45)}
.vs-crown{font-size:15px;display:inline-block;animation:crown-bounce 1.6s var(--spring) infinite}
@keyframes crown-bounce{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-5px) rotate(8deg)}}
.vs-badge{
  position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-family:var(--disp);font-weight:900;font-size:17px;letter-spacing:.06em;color:var(--ink);
  background:rgba(7,11,20,.7);border:1px solid var(--glass-brd2);
  box-shadow:0 0 24px rgba(245,196,69,.15);
}
.vs-badge::before{
  content:"";position:absolute;inset:-3px;border-radius:50%;z-index:-1;
  background:conic-gradient(var(--pa-mark), var(--gold), var(--pb-mark), var(--gold), var(--pa-mark));
  animation:spin 4s linear infinite;
}
@keyframes spin{to{transform:rotate(1turn)}}
.tug{margin-top:16px}
.tug-bar{
  position:relative;height:14px;border-radius:8px;overflow:hidden;
  background:rgba(0,0,0,.35);box-shadow:inset 0 1px 3px rgba(0,0,0,.5);
  display:flex;
}
.tug-a,.tug-b{height:100%;transition:width .8s var(--swift);position:relative}
.tug-a{background:linear-gradient(90deg, var(--pa-deep), var(--pa-mark) 70%, var(--pa));border-radius:8px 0 0 8px}
.tug-b{background:linear-gradient(90deg, var(--pb), var(--pb-mark) 30%, var(--pb-deep));border-radius:0 8px 8px 0}
.tug-a::after,.tug-b::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg, transparent 20%, rgba(255,255,255,.28) 50%, transparent 80%);
  background-size:220% 100%;animation:tug-shimmer 2.8s linear infinite;
}
@keyframes tug-shimmer{from{background-position:160% 0}to{background-position:-60% 0}}
.tug-gap{width:4px;height:100%;background:var(--bg);flex:none}
.tug-notch{
  position:absolute;top:-4px;bottom:-4px;width:2px;left:50%;transform:translateX(-50%);
  background:rgba(234,242,255,.5);border-radius:2px;box-shadow:0 0 8px rgba(234,242,255,.6);
}
.vs-verdict{
  margin-top:11px;text-align:center;font-family:var(--disp);font-size:10.5px;font-weight:700;
  letter-spacing:.26em;text-transform:uppercase;color:var(--ink-dim);
}
.vs-verdict b{color:var(--gold);text-shadow:0 0 12px rgba(245,196,69,.4)}

/* per-category rallies */
.court{position:relative;padding:4px 0}
.rally{display:grid;grid-template-columns:1fr 96px 1fr;align-items:center;gap:2px;padding:9px 0}
.side{display:flex;align-items:center;gap:9px;min-width:0}
.side.l{justify-content:flex-end}
.side.r{flex-direction:row-reverse;justify-content:flex-end}
.track{flex:1;height:20px;background:rgba(0,0,0,.3);border-radius:6px;display:flex;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.side.l .track{justify-content:flex-end}
.fill{height:100%;transition:width .7s var(--swift);min-width:2px;position:relative}
.fill.a{background:linear-gradient(90deg, var(--pa-deep), var(--pa-mark));border-radius:6px 0 0 6px}
.fill.b{background:linear-gradient(90deg, var(--pb-mark), var(--pb-deep));border-radius:0 6px 6px 0}
.side.l .fill{border-radius:6px 4px 4px 6px}
.side.r .fill{border-radius:4px 6px 6px 4px}
.sc{font-family:var(--mono);font-size:14px;font-weight:700;width:34px;flex:none}
.side.l .sc{text-align:left;color:var(--pa)}
.side.r .sc{text-align:right;color:var(--pb)}
.mid{text-align:center;padding:0 6px}
.mid .n{font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mid);display:block}
.mid .cap{font-family:var(--mono);font-size:9.5px;color:var(--ink-dim)}

/* ---------------------------------------------------------------
   BREAKDOWN ("where the points went")
   --------------------------------------------------------------- */
.split{display:flex;gap:3px;margin-top:9px;height:10px}
.split .seg{background:rgba(0,0,0,.3);border-radius:4px;overflow:hidden;position:relative}
.split .seg i{display:block;height:100%;border-radius:4px;transition:width .7s var(--swift)}
.golden{
  position:relative;border-radius:12px;padding:13px 15px 13px 18px;margin-top:18px;
  font-size:13.5px;color:var(--ink-mid);
  background:linear-gradient(90deg, rgba(245,196,69,.1), transparent 70%);
  overflow:hidden;
}
.golden::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;
  background:var(--gold);box-shadow:0 0 12px var(--gold)}
.golden b{color:var(--ink)}

/* ---------------------------------------------------------------
   WEEK VIEW
   --------------------------------------------------------------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{
  background:rgba(7,11,20,.4);border:1px solid var(--line-soft);border-radius:12px;
  padding:12px 13px;transition:transform .25s var(--spring), border-color .25s, background .25s;
}
.stat:hover{transform:translateY(-3px);border-color:var(--glass-brd2);background:rgba(7,11,20,.6)}
.stat .k{font-family:var(--disp);font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim)}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:800;margin-top:4px}
.stat .v small{font-size:11.5px;color:var(--ink-dim);font-weight:500}

.chart-zone{position:relative}
.chart{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:10px;border-bottom:1px solid var(--line)}
.daycol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;border-radius:8px;
  transition:background .2s;position:relative;cursor:pointer}
.daycol:hover{background:rgba(148,178,255,.05)}
.pair{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;padding:0 4px}
.bar{
  width:15px;border-radius:5px 5px 2px 2px;min-height:2px;
  transform-origin:bottom center;
  animation:bar-grow .8s var(--swift) both;animation-delay:var(--d,0ms);
  transition:filter .2s;
}
@keyframes bar-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.daycol:hover .bar{filter:brightness(1.25) saturate(1.1)}
.bar.a{background:linear-gradient(180deg, var(--pa), var(--pa-mark) 30%, var(--pa-deep));box-shadow:0 0 10px rgba(239,91,42,.25)}
.bar.b{background:linear-gradient(180deg, var(--pb), var(--pb-mark) 30%, var(--pb-deep));box-shadow:0 0 10px rgba(34,160,204,.25)}
.bar.ghost{background:rgba(148,178,255,.08);box-shadow:none}
.xaxis{display:flex;gap:8px;padding-top:8px}
.xlab{flex:1;text-align:center;font-family:var(--disp);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.xlab .xd{display:block;font-family:var(--mono);font-size:10px;font-weight:500}
.xlab.now{color:var(--gold);text-shadow:0 0 10px rgba(245,196,69,.5)}
.legend{display:flex;gap:16px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.legend .li{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-mid)}
.legend .dot{width:9px;height:9px;border-radius:3px}
.tip{
  position:absolute;z-index:20;pointer-events:none;transform:translate(-50%,-110%);
  background:rgba(7,11,20,.94);border:1px solid var(--glass-brd2);border-radius:10px;
  padding:8px 11px;font-size:12px;line-height:1.5;white-space:nowrap;
  box-shadow:0 10px 26px rgba(0,0,0,.5);
  animation:tip-in .18s var(--swift) both;
}
@keyframes tip-in{from{opacity:0;transform:translate(-50%,-98%)}to{opacity:1;transform:translate(-50%,-110%)}}
.tip .th{font-family:var(--disp);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:3px}
.tip .tr{display:flex;align-items:center;gap:7px}
.tip .tr .dot{width:8px;height:8px;border-radius:3px;flex:none}
.tip .tr b{font-family:var(--mono);margin-left:auto;padding-left:12px}

/* rebalance */
.wt-row{display:grid;grid-template-columns:130px 1fr 122px;gap:13px;align-items:center;padding:10px 0;border-top:1px solid var(--line-soft)}
.wt-row:first-of-type{border-top:none}
.wt-name{font-family:var(--disp);font-size:12.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.meter{height:8px;background:rgba(0,0,0,.32);border-radius:5px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.meter i{display:block;height:100%;border-radius:5px;background:var(--ink-dim);transition:width .7s var(--swift);position:relative;overflow:hidden}
.meter i::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg, transparent 30%, rgba(255,255,255,.25) 50%, transparent 70%);
  background-size:200% 100%;animation:tug-shimmer 3s linear infinite;
}
.meter i.weak{background:linear-gradient(90deg, #a63049, var(--bad))}
.meter i.strong{background:linear-gradient(90deg, var(--gold-deep), var(--gold))}
.meter-cap{font-size:10.5px;color:var(--ink-dim);margin-top:5px;font-family:var(--mono)}
.stepper{display:flex;align-items:center;justify-content:flex-end;gap:9px}
.step{
  width:30px;height:30px;border:1px solid var(--line);border-radius:10px;color:var(--ink-mid);
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;
  transition:all .2s var(--spring);background:rgba(255,255,255,.02);
}
.step:hover:not(:disabled){border-color:var(--glass-brd2);color:var(--ink);transform:translateY(-2px)}
.step:active:not(:disabled){transform:scale(.85)}
.step:disabled{opacity:.22;cursor:not-allowed}
.stepper .n{font-family:var(--mono);font-size:17px;font-weight:800;width:30px;text-align:center;transition:transform .25s var(--spring)}
.stepper .n.tick{animation:n-tick .3s var(--spring)}
@keyframes n-tick{0%{transform:scale(1.5)}100%{transform:scale(1)}}

.budget{
  display:flex;align-items:center;gap:11px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);
  flex-wrap:wrap;
}
.btn{
  position:relative;border:1px solid var(--line);border-radius:12px;padding:10px 17px;overflow:hidden;
  font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mid);
  background:rgba(255,255,255,.02);
  transition:all .25s var(--spring);
}
.btn:hover:not(:disabled){border-color:var(--glass-brd2);color:var(--ink);transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.btn:active:not(:disabled){transform:scale(.94)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.gold{
  background:linear-gradient(135deg, var(--gold), #ffd76b);border-color:transparent;color:#241a02;font-weight:800;
  box-shadow:0 0 18px rgba(245,196,69,.3), 0 4px 14px rgba(0,0,0,.35);
}
.btn.gold:hover:not(:disabled){box-shadow:0 0 28px rgba(245,196,69,.5), 0 8px 20px rgba(0,0,0,.4);color:#241a02}
.btn.gold::after{
  content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
  background:linear-gradient(105deg, transparent, rgba(255,255,255,.5), transparent);
  animation:shine 3.2s ease-in-out infinite;
}
.btn.danger{border-color:rgba(255,92,122,.35);color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad);box-shadow:0 0 16px rgba(255,92,122,.25)}

/* ---------------------------------------------------------------
   30-DAY GRID
   --------------------------------------------------------------- */
.dgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
@media(max-width:760px){.dgrid{grid-template-columns:repeat(6,1fr)}}
@media(max-width:480px){.dgrid{grid-template-columns:repeat(5,1fr)}}
.dcell{
  position:relative;background:rgba(7,11,20,.45);border:1px solid var(--line-soft);border-radius:11px;
  padding:8px 5px 6px;display:flex;flex-direction:column;gap:6px;cursor:pointer;
  animation:cell-in .55s var(--swift) both;animation-delay:var(--d,0ms);
  transition:transform .25s var(--spring), border-color .25s, box-shadow .25s, background .25s;
}
@keyframes cell-in{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.dcell:hover{transform:translateY(-4px) scale(1.06);border-color:var(--glass-brd2);background:rgba(16,25,44,.8);
  box-shadow:0 12px 26px rgba(0,0,0,.45);z-index:5}
.dcell.today{border-color:rgba(245,196,69,.6);box-shadow:0 0 0 1px rgba(245,196,69,.3), 0 0 18px rgba(245,196,69,.15)}
.dcell.today::before{
  content:"";position:absolute;inset:-1px;border-radius:11px;pointer-events:none;
  border:1px solid rgba(245,196,69,.5);
  animation:today-ring 2.2s ease-out infinite;
}
@keyframes today-ring{
  0%{transform:scale(1);opacity:.8}
  100%{transform:scale(1.28);opacity:0}
}
.dcell .dn{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink-dim);text-align:center}
.dcell.today .dn{color:var(--gold)}
.dbars{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:38px}
.dbar{width:9px;border-radius:3px 3px 1px 1px;background:rgba(148,178,255,.07);min-height:2px;transition:height .5s var(--swift)}
.dbar.a{background:linear-gradient(180deg, var(--pa), var(--pa-mark));box-shadow:0 0 6px rgba(239,91,42,.3)}
.dbar.b{background:linear-gradient(180deg, var(--pb), var(--pb-mark));box-shadow:0 0 6px rgba(34,160,204,.3)}

.lvl{padding:16px 0;border-top:1px solid var(--line-soft)}
.lvl:first-of-type{border-top:none;padding-top:0}
.lvl-top{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.lvl-name{font-family:var(--disp);font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.lvl-tier{font-size:13px;color:var(--ink-mid);margin-left:auto}
.lvl-pts{font-family:var(--mono);font-size:20px;font-weight:800}
.lvl-bar{position:relative;height:12px;background:rgba(0,0,0,.32);border-radius:7px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}
.lvl-bar i{
  display:block;height:100%;border-radius:7px;transition:width .9s var(--swift);
  position:relative;overflow:hidden;
}
.lvl-bar i::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg, transparent 25%, rgba(255,255,255,.35) 50%, transparent 75%);
  background-size:200% 100%;animation:tug-shimmer 2.4s linear infinite;
}
.lvl-next{font-size:12px;color:var(--ink-dim);margin-top:7px}
.lvl-marks{position:absolute;inset:0;pointer-events:none}
.lvl-marks i{position:absolute;top:0;bottom:0;width:2px;background:rgba(7,11,20,.6)}
.lvl-ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.lvl-ladder{grid-template-columns:repeat(2,1fr)}}
.lvl-ladder .li{
  font-size:12.5px;color:var(--ink-dim);padding:8px 10px;border-radius:10px;border:1px solid transparent;
  transition:all .25s;
}
.lvl-ladder .li:hover{border-color:var(--line);color:var(--ink-mid);transform:translateY(-2px)}
.lvl-ladder .li .m{font-family:var(--mono);font-weight:700}

/* ---------------------------------------------------------------
   SETUP
   --------------------------------------------------------------- */
.field{margin-bottom:15px}
.field .eyebrow{display:block;margin-bottom:7px}
.rule{border:none;border-top:1px solid var(--line);margin:20px 0}
.empty{color:var(--ink-dim);font-size:14px;padding:26px 0;text-align:center}
.empty .e-ico{display:block;font-size:30px;margin-bottom:8px;animation:float-y 3s ease-in-out infinite}
@keyframes float-y{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* toast */
.toast{
  position:fixed;right:20px;bottom:20px;z-index:120;
  display:flex;align-items:center;gap:9px;
  font-family:var(--disp);font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  background:rgba(16,25,44,.92);border:1px solid rgba(245,196,69,.35);border-radius:99px;padding:9px 17px;
  color:var(--gold);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 12px 30px rgba(0,0,0,.5), 0 0 18px rgba(245,196,69,.12);
  opacity:0;transform:translateY(16px) scale(.9);pointer-events:none;
  transition:opacity .3s, transform .35s var(--spring);
}
.toast.show{opacity:1;transform:translateY(0) scale(1)}
.toast svg{width:13px;height:13px}
.toast svg path{stroke-dasharray:20;stroke-dashoffset:20}
.toast.show svg path{animation:draw-tick .4s ease-out .15s both}
@keyframes draw-tick{to{stroke-dashoffset:0}}

/* perfect-day flash */
.flash{
  position:fixed;inset:0;z-index:150;display:grid;place-items:center;pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(245,196,69,.14), transparent 60%);
  animation:flash-fade 1.9s var(--swift) both;
}
@keyframes flash-fade{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}
.flash .fword{

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect} = React;
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================================================
   Scoring model — straight from the challenge doc
   ============================================================ */
const CATS = [
  {key:'wakeup',   label:'Wakeup',   icon:'🌅', base:10, tone:'#F5C445'},
  {key:'workout',  label:'Workout',  icon:'💪', base:25, tone:'#EF5B2A'},
  {key:'work',     label:'Work',     icon:'💼', base:25, tone:'#22A0CC'},
  {key:'personal', label:'Personal', icon:'🌱', base:25, tone:'#7BC96F'},
  {key:'sleep',    label:'Sleep',    icon:'😴', base:15, tone:'#B78CF0'},
];
const BASE_W = {wakeup:10,workout:25,work:25,personal:25,sleep:15};
const TIERS = [
  {v:0,  t:'Rest day'},
  {v:8,  t:'10–20 min'},
  {v:12, t:'20–30 min'},
  {v:17, t:'30–45 min'},
  {v:20, t:'45–60 min'},
  {v:22, t:'60+ min'},
];
const LEVELS = [
  {min:0,    name:'Getting Started', icon:'🌱'},
  {min:501,  name:'Building',        icon:'🌿'},
  {min:1001, name:'Consistent',      icon:'💪'},
  {min:1501, name:'Strong',          icon:'🔥'},
  {min:2001, name:'Disciplined',     icon:'🏆'},
  {min:2501, name:'Level Up',        icon:'👑'},
];

const emptyEntry = () => ({
  wakeup:{onTime:false,noSnooze:false,noScroll:false},
  workout:{tier:0,extra:false,activity:''},
  work:{focus:0,discipline:0,learning:0},
  personal:{reading:0,phone:0,water:0,food:0,hobby:0},
  sleep:{bed:false,enough:false,phoneAway:false,prep:false},
  note:''
});

function rawScores(e){
  if(!e) return {wakeup:0,workout:0,work:0,personal:0,sleep:0};
  const w=e.wakeup||{}, wo=e.workout||{}, wk=e.work||{}, p=e.personal||{}, s=e.sleep||{};
  return {
    wakeup:(w.onTime?7:0)+(w.noSnooze?2:0)+(w.noScroll?1:0),
    workout:Math.min(25,(wo.tier||0)+((wo.tier||0)>0&&wo.extra?3:0)),
    work:(wk.focus||0)+(wk.discipline||0)+(wk.learning||0),
    personal:(p.reading||0)+(p.phone||0)+(p.water||0)+(p.food||0)+(p.hobby||0),
    sleep:(s.bed?7:0)+(s.enough?5:0)+(s.phoneAway?2:0)+(s.prep?1:0),
  };
}
/* Sub-scores are always logged against the fixed rubric, then scaled by the
   week's weights. That keeps the rubric stable while rebalancing changes value. */
function score(e, weights){
  const raw = rawScores(e);
  const weighted = {}; let total = 0;
  for(const c of CATS){
    const v = Math.round(raw[c.key] / c.base * (weights[c.key] ?? c.base));
    weighted[c.key] = v; total += v;
  }
  return {raw, weighted, total, logged: !!e};
}
const levelFor = pts => [...LEVELS].reverse().find(l => pts >= l.min) || LEVELS[0];

/* ============================================================
   Dates
   ============================================================ */
const pad = n => String(n).padStart(2,'0');
const toKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d=fromKey(k); d.setDate(d.getDate()+n); return toKey(d); };
const diffDays = (a,b) => Math.round((fromKey(a)-fromKey(b))/86400000);
const TODAY = toKey(new Date());
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pretty = k => { const d=fromKey(k); return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
const weekOf = (k,start) => Math.floor(Math.max(0,diffDays(k,start))/7)+1;
const weekDates = (w,start) => Array.from({length:7},(_,i)=>addDays(start,(w-1)*7+i));

/* ============================================================
   Storage — window.storage inside Claude, localStorage standalone
   ============================================================ */
const KEY='project100:state', ME='project100:me';
const hasClaude = typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
const store = {
  async get(k, shared){
    if(hasClaude){ try{ const r=await window.storage.get(k,shared); return r? JSON.parse(r.value):null; }catch(e){ return null; } }
    try{ const v=localStorage.getItem(k); return v? JSON.parse(v):null; }catch(e){ return null; }
  },
  async set(k, val, shared){
    if(hasClaude){ try{ await window.storage.set(k, JSON.stringify(val), shared); }catch(e){} return; }
    try{ localStorage.setItem(k, JSON.stringify(val)); }catch(e){}
  }
};
const freshState = () => ({
  v:1,
  names:{a:'Player A', b:'Player B'},
  start:TODAY,
  weights:{},                 // {weekNumber: {cat: pts}}
  entries:{a:{}, b:{}}
});
const weightsFor = (st,w) => ({...BASE_W, ...(st.weights[w]||{})});

/* ============================================================
   Week maths
   ============================================================ */
function weekStats(entries, dates, weights){
  let total=0,best=0,bestDay=null,logged=0,workout=0,learning=0,sleep=0;
  const perDay=[], catTotals={};
  CATS.forEach(c=>catTotals[c.key]=0);
  dates.forEach(k=>{
    const e = entries[k];
    const s = score(e, weights);
    perDay.push({date:k, ...s});
    if(!e) return;
    logged++; total += s.total;
    if(s.total>best){best=s.total; bestDay=k;}
    CATS.forEach(c=>catTotals[c.key]+=s.weighted[c.key]);
    if(s.raw.workout>0) workout++;
    if((e.work&&e.work.learning||0)>0) learning++;
    if(s.raw.sleep>=12) sleep++;
  });
  return {total,best,bestDay,logged,workout,learning,sleep,perDay,catTotals,
          avg: logged? Math.round(total/logged) : 0};
}
function streakFor(entries){
  let n=0, k=TODAY;
  if(!entries[k]) k = addDays(TODAY,-1);           // today not logged yet is fine
  while(entries[k] && score(entries[k],BASE_W).total>0){ n++; k=addDays(k,-1); }
  return n;
}

/* ============================================================
   FX — confetti cannon (canvas, zero deps) + event bus
   ============================================================ */
const boom = detail => { if(!REDUCED) window.dispatchEvent(new CustomEvent('p100:boom',{detail:detail||{}})); };
function ConfettiLayer(){
  const ref = useRef(null);
  useEffect(()=>{
    const cv = ref.current, ctx = cv.getContext('2d');
    const DPR = Math.min(2, window.devicePixelRatio||1);
    let parts = [], raf = null;
    const resize = () => { cv.width = innerWidth*DPR; cv.height = innerHeight*DPR; };
    resize(); addEventListener('resize', resize);
    const COLORS = ['#EF5B2A','#FF7A4D','#F5C445','#22A0CC','#4FC3E8','#EAF2FF'];
    const tick = () => {
      ctx.clearRect(0,0,cv.width,cv.height);
      parts = parts.filter(p => p.life > 0);
      for(const p of parts){
        p.vy += 0.16*DPR;                 // gravity
        p.vx *= 0.992; p.vy *= 0.992;     // drag
        p.x += p.vx; p.y += p.vy;
        p.rot += p.vr; p.life -= 1;
        const fade = Math.min(1, p.life/28);
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.scale(1, Math.sin(p.life*p.wob)); // paper flutter
        ctx.fillStyle = p.c;
        if(p.shape===0) ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*0.62);
        else { ctx.beginPath(); ctx.arc(0,0,p.s*0.34,0,7); ctx.fill(); }
        ctx.restore();
      }
      if(parts.length) raf = requestAnimationFrame(tick); else raf = null;
    };
    const fire = e => {
      const d = e.detail || {};
      const n = d.count || 120;
      const cx = (d.x!=null ? d.x : innerWidth/2)*DPR;
      const cy = (d.y!=null ? d.y : innerHeight*0.35)*DPR;
      for(let i=0;i<n;i++){
        const ang = (d.angle!=null ? d.angle : -Math.PI/2) + (Math.random()-.5)*(d.spread||2.2);
        const pow = (5+Math.random()*9)*DPR*(d.power||1);
        parts.push({
          x:cx, y:cy,
          vx:Math.cos(ang)*pow, vy:Math.sin(ang)*pow,
          s:(5+Math.random()*6)*DPR,
          c:(d.colors||COLORS)[i%(d.colors||COLORS).length],
          rot:Math.random()*6.3, vr:(Math.random()-.5)*.3,
          wob:.08+Math.random()*.12,
          life:110+Math.random()*70,
          shape:Math.random()<.8?0:1,
        });
      }
      if(!raf) raf = requestAnimationFrame(tick);
    };
    addEventListener('p100:boom', fire);
    return ()=>{ removeEventListener('p100:boom', fire); removeEventListener('resize', resize); if(raf) cancelAnimationFrame(raf); };
  },[]);
  return <canvas ref={ref} className="fx" aria-hidden="true"/>;
}

/* ============================================================
   FX — living background
   ============================================================ */
function Sky(){
  const stars = useMemo(()=>Array.from({length:64},(_,i)=>({
    id:i,
    left:Math.random()*100, top:Math.random()*100,
    size:Math.random()<.85 ? 1.5 : 2.5,
    tw:(2.5+Math.random()*5).toFixed(1)+'s',
    maxo:(.25+Math.random()*.5).toFixed(2),
    delay:(Math.random()*4).toFixed(1)+'s',
  })),[]);
  return (
    <div className="sky" aria-hidden="true">
      <div className="orb a"/><div className="orb b"/><div className="orb g"/>
      {stars.map(s=>(
        <span key={s.id} className="star" style={{
          left:s.left+'%', top:s.top+'%', width:s.size, height:s.size,
          '--tw':s.tw, '--maxo':s.maxo, animationDelay:s.delay
        }}/>
      ))}
    </div>
  );
}

/* ============================================================
   Small pieces
   ============================================================ */
function useCountUp(target, dur){
  const [v,setV] = useState(target);
  const prev = useRef(target);
  useEffect(()=>{
    const from = prev.current, to = target;
    prev.current = target;
    if(from===to) return;
    if(REDUCED){ setV(to); return; }
    let raf; const t0 = performance.now(), D = dur||650;
    const step = t => {
      const p = Math.min(1,(t-t0)/D), e = 1-Math.pow(1-p,3);
      setV(Math.round(from+(to-from)*e));
      if(p<1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[target]);
  return v;
}
const Num = ({v,dur,style,className}) => {
  const n = useCountUp(v,dur);
  return <span className={'num '+(className||'')} style={style}>{n}</span>;
};

function Ring({val, max, size, tone, label}){
  const S = size||96, R = (S-10)/2, C = 2*Math.PI*R;
  const pct = Math.max(0, Math.min(1, val/max));
  const [pulse,setPulse] = useState(false);
  const first = useRef(true);
  useEffect(()=>{
    if(first.current){ first.current=false; return; }
    setPulse(true);
    const t = setTimeout(()=>setPulse(false), 520);
    return ()=>clearTimeout(t);
  },[val]);
  const id = useMemo(()=>'rg'+Math.random().toString(36).slice(2,8),[]);
  return (
    <div className={'ring-wrap'+(pulse?' ring-pulse':'')} style={{width:S,height:S}}
         role="img" aria-label={(label||'score')+': '+val+' of '+max}>
      <svg width={S} height={S}>
        <defs>
          <linearGradient id={id} x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor={tone}/>
            <stop offset="100%" stopColor="#F5C445"/>
          </linearGradient>
        </defs>
        <circle className="ring-track" cx={S/2} cy={S/2} r={R}/>
        <circle className="ring-val" cx={S/2} cy={S/2} r={R}
          stroke={'url(#'+id+')'}
          strokeDasharray={C}
          strokeDashoffset={C*(1-pct)}
          style={{filter:'drop-shadow(0 0 6px '+tone+'66)'}}/>
      </svg>
      <div className="ring-center">
        <div>
          <div className="rv" style={{color:tone}}><Num v={val}/></div>
          <div className="rl">{label||('of '+max)}</div>
        </div>
      </div>
    </div>
  );
}

const Tick = () => (
  <svg viewBox="0 0 12 12" fill="none" stroke="#241a02" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
    <path d="M1.5 6.4 4.4 9.3 10.5 2.8"/>
  </svg>
);
function Check({label, pts, on, set}){
  return (
    <label className="check">
      <input type="checkbox" checked={!!on} onChange={e=>set(e.target.checked)} />
      <span className="box">
        <Tick/>
        <span className="burst" aria-hidden="true"><i/><i/><i/><i/><i/><i/></span>
      </span>
      <span>{label}</span>
      <span className="val">+{pts}</span>
    </label>
  );
}
function Slide({label, max, val, set, tone}){
  const pct = Math.round(((val||0)/max)*100);
  return (
    <div className="slider-row">
      <label htmlFor={'s-'+label}>{label}</label>
      <input id={'s-'+label} className={tone} type="range" min="0" max={max} value={val||0}
             style={{'--pct':pct+'%'}}
             onChange={e=>set(+e.target.value)} aria-label={label}/>
      <span className="v">{val||0}<span className="om">/{max}</span></span>
    </div>
  );
}

/* card with cursor spotlight + entrance delay */
function Card({title, note, children, style, delay}){
  const ref = useRef(null);
  const onMove = e => {
    const el = ref.current; if(!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--mx',(e.clientX-r.left)+'px');
    el.style.setProperty('--my',(e.clientY-r.top)+'px');
  };
  return (
    <section ref={ref} className="card rise" style={{...style,'--d':(delay||0)+'ms'}} onPointerMove={onMove}>
      {(title||note) && (
        <div className="card-head">
          {title && <h2>{title}</h2>}
          {note && <div className="card-note">{note}</div>}
        </div>
      )}
      {children}
    </section>
  );
}

/* ============================================================
   Log form
   ============================================================ */
function LogForm({entry, weights, tone, onChange}){
  const e = entry || emptyEntry();
  const s = score(entry, weights);
  const set = (cat, patch) => onChange({...e, [cat]:{...e[cat], ...patch}});

  const CatBlock = ({c, children}) => {
    const w = weights[c.key] ?? c.base;
    const got = s.weighted[c.key];
    const full = got>=w && w>0;
    const pct = w>0 ? Math.round(got/w*100) : 0;
    return (
      <div className={'cat'+(full?' maxed':'')}>
        <div className="cat-top">
          <span className="cat-ico" aria-hidden="true">{c.icon}</span>
          <span className="cat-name">{c.label}</span>
          {w !== c.base && <span className="wt-flag">{w>c.base?'▲':'▼'} {w}</span>}
          <span className={'cat-pts'+(full?' full':'')}><b>{got}</b>/{w}</span>
        </div>
        {children}
        <div className="cat-meter" aria-hidden="true">
          <i style={{width:pct+'%','--tone':c.tone}}/>
        </div>
      </div>
    );
  };

  return (
    <div>
      <CatBlock c={CATS[0]}>
        <Check label="Woke up around my target time" pts="7" on={e.wakeup.onTime} set={v=>set('wakeup',{onTime:v})}/>
        <Check label="Got out of bed without snoozing" pts="2" on={e.wakeup.noSnooze} set={v=>set('wakeup',{noSnooze:v})}/>
        <Check label="Didn't reach for the phone first" pts="1" on={e.wakeup.noScroll} set={v=>set('wakeup',{noScroll:v})}/>
      </CatBlock>

      <CatBlock c={CATS[1]}>
        <div className="tiers">
          {TIERS.map(t=>(
            <button key={t.v} className={'tier'+(e.workout.tier===t.v?' on':'')}
                    onClick={()=>set('workout',{tier:t.v})}>
              {t.t}<b>{t.v?'+'+t.v:'0'}</b>
            </button>
          ))}
        </div>
        <Check label="Pushed harder than usual" pts="3" on={e.workout.extra} set={v=>set('workout',{extra:v})}/>
        <input className="txt" style={{marginTop:8}} placeholder="What did you do? (run, gym, badminton…)"
               value={e.workout.activity||''} onChange={ev=>set('workout',{activity:ev.target.value})}/>
      </CatBlock>

      <CatBlock c={CATS[2]}>
        <Slide label="Focus" max={10} val={e.work.focus} set={v=>set('work',{focus:v})} tone={tone}/>
        <Slide label="Work discipline" max={5} val={e.work.discipline} set={v=>set('work',{discipline:v})} tone={tone}/>
        <Slide label="Learning" max={10} val={e.work.learning} set={v=>set('work',{learning:v})} tone={tone}/>
      </CatBlock>

      <CatBlock c={CATS[3]}>
        <Slide label="Reading" max={5} val={e.personal.reading} set={v=>set('personal',{reading:v})} tone={tone}/>
        <Slide label="Phone discipline" max={5} val={e.personal.phone} set={v=>set('personal',{phone:v})} tone={tone}/>
        <Slide label="Water" max={5} val={e.personal.water} set={v=>set('personal',{water:v})} tone={tone}/>
        <Slide label="Food" max={5} val={e.personal.food} set={v=>set('personal',{food:v})} tone={tone}/>
        <Slide label="Hobby / meditation" max={5} val={e.personal.hobby} set={v=>set('personal',{hobby:v})} tone={tone}/>
      </CatBlock>

      <CatBlock c={CATS[4]}>
        <Check label="Got into bed around my target time" pts="7" on={e.sleep.bed} set={v=>set('sleep',{bed:v})}/>
        <Check label="Slept enough hours" pts="5" on={e.sleep.enough} set={v=>set('sleep',{enough:v})}/>
        <Check label="Phone away before bed" pts="2" on={e.sleep.phoneAway} set={v=>set('sleep',{phoneAway:v})}/>
        <Check label="Set tomorrow up before sleeping" pts="1" on={e.sleep.prep} set={v=>set('sleep',{prep:v})}/>
      </CatBlock>

      <div className="cat">
        <span className="eyebrow" style={{display:'block',marginBottom:6}}>Note to self</span>
        <input className="txt" placeholder="One honest line about today"
               value={e.note||''} onChange={ev=>onChange({...e, note:ev.target.value})}/>
      </div>
    </div>
  );
}

/* ============================================================
   Versus hero + per-category court
   ============================================================ */
function VersusHero({names, sA, sB, subtitle}){
  const total = sA.total + sB.total;
  const shareA = total>0 ? sA.total/total*100 : 50;
  const lead = sA.total===sB.total ? null : (sA.total>sB.total ? 'a' : 'b');
  return (
    <div className="versus rise" style={{'--d':'40ms'}}>
      <div className="versus-row">
        <div className="vs-side l">
          <span className="vs-name a-tx">{lead==='a' && <span className="vs-crown" aria-label="leading">👑 </span>}{names.a}</span>
          <span className="vs-score"><Num v={sA.total}/><span className="of"> /100</span></span>
        </div>
        <div className="vs-badge" aria-hidden="true">VS</div>
        <div className="vs-side r">
          <span className="vs-name b-tx">{names.b}{lead==='b' && <span className="vs-crown" aria-label="leading"> 👑</span>}</span>
          <span className="vs-score"><Num v={sB.total}/><span className="of"> /100</span></span>
        </div>
      </div>
      <div className="tug" aria-hidden="true">
        <div className="tug-bar">
          <div className="tug-a" style={{width:shareA+'%'}}/>
          <div className="tug-gap"/>
          <div className="tug-b" style={{width:(100-shareA)+'%'}}/>
          <div className="tug-notch"/>
        </div>
      </div>
      <div className="vs-verdict">
        {subtitle || (lead===null
          ? 'Dead level — next point takes it'
          : <span><b>{names[lead]}</b> ahead by {Math.abs(sA.total-sB.total)}</span>)}
      </div>
    </div>
  );
}

function Court({names, sA, sB, weights}){
  return (
    <div className="court">
      {CATS.map(c=>{
        const w = weights[c.key] ?? c.base;
        const a = sA.weighted[c.key], b = sB.weighted[c.key];
        return (
          <div className="rally" key={c.key}>
            <div className="side l">
              <span className="sc">{a}</span>
              <div className="track"><div className="fill a" style={{width:(w?a/w*100:0)+'%'}}/></div>
            </div>
            <div className="mid">
              <span className="n">{c.label}</span>
              <span className="cap">{w} pts{w!==c.base?' ▲':''}</span>
            </div>
            <div className="side r">
              <span className="sc">{b}</span>
              <div className="track"><div className="fill b" style={{width:(w?b/w*100:0)+'%'}}/></div>
            </div>
          </div>
        );
      })}
    </div>
  );
}
